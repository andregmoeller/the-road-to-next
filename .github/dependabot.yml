version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Learning project: always move the range to the latest version
    versioning-strategy: increase
    groups:
      # Security fixes (incl. transitive deps like hono, minimatch) in one PR
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # Packages that must move together
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      react-email:
        patterns:
          - "react-email"
          - "@react-email/*"
      # Everything else: minor and patch in one PR
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
